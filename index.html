<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business Tinder</title>
<meta name="description" content="Blind cross-campus matching for 180DC ESCP members: swipe, match, have a coffee chat.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234C7521'/%3E%3Cpath d='M9 13h12v5a6 6 0 0 1-12 0z' fill='%23ffffff'/%3E%3Cpath d='M21 14h1.5a2.5 2.5 0 0 1 0 5H21' fill='none' stroke='%2390C03E' stroke-width='1.8'/%3E%3C/svg%3E">
<meta name="theme-color" content="#4C7521">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 180DC ESCP branding: forest green, lime accent, Glacial Indifference headings (served by 180dc-escp.org). */
@font-face{font-family:'Glacial Indifference';src:url('https://180dc-escp.org/fonts/GlacialIndifference-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
/* Layout: one centred column (max 1040px) under a sticky header with tabs. The deck card is a rail ticket
   between two campuses; everything else is plain stacked sections. Colour comes only from the six campuses,
   the interface itself stays ink on paper. */
:root{
  --paper:#F5F5F3; --surface:#FFFFFF; --surface-2:#ECEEE8; --ink:#141414; --ink-2:#3A4234; --muted:#6E6E6B;
  --line:#E2E3DE; --line-2:#CFD1CA; --focus:#4C7521;
  --brand:#4C7521; --brand-2:#3B5C18; --brand-deep:#1D3410; --lime:#90C03E; --tint:#EEF5E6; --on-brand:#FFFFFF;
  --good:#1D7849; --good-soft:#E2F2E9; --bad:#B42318; --bad-soft:#FBE8E6; --warn:#97590A;
  --c-paris:#3451C6; --c-london:#BC1D57; --c-berlin:#2B873E; --c-madrid:#CC5208; --c-turin:#6940D4; --c-warsaw:#0B7C8E;
  --f-display:"Glacial Indifference","Avenir Next","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Avenir Next","Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
  --shadow:0 1px 0 rgba(18,22,33,.04),0 12px 30px -14px rgba(18,22,33,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F120C; --surface:#171B13; --surface-2:#20261A; --ink:#EEF0EA; --ink-2:#C6CCBC; --muted:#9AA08F;
  --line:#2A3122; --line-2:#3B4430; --focus:#A3D15A;
  --brand:#5E8F2A; --brand-2:#4C7521; --brand-deep:#1D3410; --lime:#A3D15A; --tint:#1E2A14; --on-brand:#FFFFFF;
  --good:#4FC48C; --good-soft:#15301F; --bad:#FF7E70; --bad-soft:#3A1916; --warn:#EDB04F;
  --c-paris:#7E96F6; --c-london:#F26C9B; --c-berlin:#5DC777; --c-madrid:#FF9B4F; --c-turin:#A68AFA; --c-warsaw:#3FC3D7;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F120C; --surface:#171B13; --surface-2:#20261A; --ink:#EEF0EA; --ink-2:#C6CCBC; --muted:#9AA08F;
  --line:#2A3122; --line-2:#3B4430; --focus:#A3D15A;
  --brand:#5E8F2A; --brand-2:#4C7521; --brand-deep:#1D3410; --lime:#A3D15A; --tint:#1E2A14; --on-brand:#FFFFFF;
  --good:#4FC48C; --good-soft:#15301F; --bad:#FF7E70; --bad-soft:#3A1916; --warn:#EDB04F;
  --c-paris:#7E96F6; --c-london:#F26C9B; --c-berlin:#5DC777; --c-madrid:#FF9B4F; --c-turin:#A68AFA; --c-warsaw:#3FC3D7;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(30px,5vw,42px);font-weight:800;line-height:1.06}
h2{font-size:22px;font-weight:700;line-height:1.2}
h3{font-size:16px;font-weight:700;line-height:1.3}
p{margin:0}
ul,ol{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.lbl{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:14px 0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand-logo{display:block;height:34px;width:auto;border-radius:6px}
.brand-sep{width:1px;height:26px;background:var(--line-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-logo,:root:not([data-theme="light"]) .login-logo{background:#fff;padding:3px 6px}}
:root[data-theme="dark"] .brand-logo,:root[data-theme="dark"] .login-logo{background:#fff;padding:3px 6px}
.accent{color:var(--brand)}
.login-logo{display:block;height:54px;width:auto;max-width:100%;object-fit:contain;align-self:flex-start;justify-self:start;border-radius:8px;margin-bottom:6px}
.site-foot{margin:56px 0 28px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.site-foot a{color:var(--brand);text-decoration:none;font-weight:600}
.site-foot a:hover{text-decoration:underline}
@media (max-width:520px){.brand-sep,.brand .lbl{display:none}.brand-logo{height:28px}}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;color:var(--ink)}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.acct .hint{overflow-wrap:anywhere}
.login{max-width:460px;margin:6vh auto 0}
.round-chip{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px 10px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .dot{position:absolute;top:8px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
main{padding-block:26px 72px}
.page{display:grid;gap:28px}

/* building blocks */
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.banner{border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:9px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--f-body);color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.c-paris{--c:var(--c-paris)}.c-london{--c:var(--c-london)}.c-berlin{--c:var(--c-berlin)}
.c-madrid{--c:var(--c-madrid)}.c-turin{--c:var(--c-turin)}.c-warsaw{--c:var(--c-warsaw)}.c-other{--c:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent}
.chip.hit{background:var(--tint);color:var(--brand-2);border-color:color-mix(in srgb,var(--brand) 32%,transparent);font-weight:600}
.tag{font:500 12px var(--f-mono);padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}
.status{font:600 12px var(--f-body);padding:2px 9px;border-radius:999px;white-space:nowrap}
.status.done{background:var(--good-soft);color:var(--good)}
.status.missed{background:var(--bad-soft);color:var(--bad)}
.status.pending{background:var(--surface-2);color:var(--muted)}

/* forms */
.form{display:grid;gap:18px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .q{font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;width:100%;min-height:42px}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.two,.three{grid-template-columns:minmax(0,1fr)}}
.opt{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font:500 13.5px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer;min-height:34px}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* join + profile */
.join{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;align-items:start}
@media (max-width:860px){.join{grid-template-columns:minmax(0,1fr)}}
.steps{list-style:none;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);font:600 13px var(--f-mono);width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center}
.mini{padding-left:20px;display:grid;gap:6px;font-size:14px}

/* the ticket */
.deck{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:780px){.deck{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;max-width:420px;width:100%;margin:0 auto}
.ticket{--c:var(--muted);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .24s ease,opacity .24s ease}
.ticket.top-card{z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.ticket.top-card:active{cursor:grabbing}
.ticket.under{position:absolute;inset:0;transform:translateY(12px) scale(.955);opacity:.55;pointer-events:none;z-index:0}
.tk-band{height:8px;background:var(--c)}
.tk-body{padding:20px 22px 18px;display:flex;flex-direction:column;gap:14px}
.tk-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.codename{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,36px);line-height:1.02;letter-spacing:-.025em;overflow-wrap:anywhere}
.fun{font-size:15px;color:var(--ink-2)}
.fun::before{content:"\201C"}.fun::after{content:"\201D"}
.tk-row{display:flex;flex-direction:column;gap:6px}
.stub{position:relative;border-top:2px dashed var(--line-2);padding:14px 22px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:12px;align-items:end;background:var(--surface-2)}
.stub::before,.stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.stub::before{left:-11px}.stub::after{right:-11px}
.stub b{display:block;font-family:var(--f-mono);font-weight:600;font-size:14px;letter-spacing:.05em;overflow-wrap:anywhere}
.stub .arrow{font-family:var(--f-mono);color:var(--muted);padding-bottom:1px}
.verdict{position:absolute;top:26px;font:800 20px var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:3px 12px;border:3px solid;border-radius:8px;pointer-events:none;z-index:2;background:var(--surface)}
.verdict.meet{right:18px;color:var(--good);transform:rotate(8deg);opacity:var(--meet,0)}
.verdict.skip{left:18px;color:var(--muted);transform:rotate(-8deg);opacity:var(--skip,0)}
.deck-actions{display:flex;gap:10px;margin-top:22px}
.deck-actions .btn{flex:1}
.picks{list-style:none;padding:0;display:grid}
.picks li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.picks li:first-child{border-top:0;padding-top:2px}
.picks b{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}

/* match reveal */
.reveal{perspective:1400px;max-width:560px}
.flip{display:grid;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.75,.2,1)}
.flip.open{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.face.front{background:var(--ink);color:var(--paper);border-color:var(--ink);justify-content:center;min-height:300px}
.face.front .lbl{color:color-mix(in srgb,var(--paper) 62%,transparent)}
.face.back{transform:rotateY(180deg)}
.bigname{font:800 clamp(30px,6.5vw,44px)/1.03 var(--f-display);letter-spacing:-.025em;overflow-wrap:anywhere}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font:500 14px var(--f-mono);user-select:all;-webkit-user-select:all;background:var(--surface-2);padding:6px 10px;border-radius:8px;overflow-wrap:anywhere}
.swap{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate .opt{min-width:44px;justify-content:center}

/* passport */
.passport{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.pp-cover{background:var(--brand-deep);color:#F5F5F3;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pp-cover .lbl{color:color-mix(in srgb,var(--lime) 80%,#fff)}
.pp-count{font:600 32px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:18px;padding:24px 22px}
.stamp{--c:var(--muted);aspect-ratio:1;width:100%;max-width:136px;margin:0 auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:10px}
.stamp.on{border:3px solid var(--c);color:var(--c);box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6.5px var(--c);transform:rotate(var(--rot,0deg))}
.stamp.off{border:2px dashed var(--line-2);color:var(--muted)}
.stamp .city{font:700 14px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.stamp small{font:500 11px var(--f-mono);letter-spacing:.04em}
.stamp.wild{--c:var(--warn)}
.wildnote{display:flex;gap:10px;align-items:center;margin:0 22px 18px;padding:10px 14px;border:1px dashed var(--warn);border-radius:12px;color:var(--ink);font-size:14px}
.wildnote b{color:var(--warn)}
.rules{max-width:720px;display:grid;gap:18px}
.rules h3{margin:0 0 6px}
.rules .mini{font-size:15px}
.rules a,.hint a,.passport a{color:var(--focus);text-underline-offset:2px}
.board{list-style:none;padding:0;display:grid}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.board li.me b{text-decoration:underline;text-underline-offset:3px}
.dots{font-family:var(--f-mono);letter-spacing:2px;color:var(--ink);white-space:nowrap}

/* map + numbers */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.kpi b{color:var(--brand);font:700 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.map-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow-x:auto}
.map{display:block;width:100%;min-width:480px;height:auto}
.m-edge{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-linecap:round}
.m-none{fill:none;stroke:var(--line-2);stroke-dasharray:2 6;stroke-linecap:round;stroke-width:1.4}
.m-badge{fill:var(--surface);stroke:var(--ink);stroke-opacity:.6;stroke-width:1.2}
.m-count{font:600 11px var(--f-mono);fill:var(--ink)}
.m-node{stroke:var(--surface);stroke-width:3}
.m-label{font:700 13px var(--f-body);fill:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:760px}
th{text-align:left;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted);font-size:12px}
.prog{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transition:width .2s}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;width:max-content;max-width:min(90vw,480px);z-index:20;box-shadow:var(--shadow)}
#toast.bad{background:var(--bad);color:var(--paper)}
.skeleton{min-height:200px;display:grid;place-items:center;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.flip,.ticket,.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">

<script>
'use strict';
// 180DC ESCP's campuses. (Warsaw has no members yet: add 'Warsaw' back here when it does.)
const CAMPUSES=['Paris','London','Berlin','Madrid','Turin'];
// 'Other' is for members on exchange or a semester break. It never counts as anyone's own campus,
// earns no passport stamp and isn't on the map.
const OTHER='Other';
const CAMPUS_OPTS=CAMPUSES.concat([OTHER]);
function sameCampus(a,b){return !!a&&a===b&&a!==OTHER}
// A passport has one stamp per campus, all earned through chats. Your home campus comes last: once you've
// collected every other campus, you're paired with someone from your own campus on another team.
function stampTotal(){return CAMPUSES.length}
// Wildcard: meeting someone on 'Other' (exchange, break). It only ever fills your LAST missing campus.
function passportScore(campus,chatCampuses,wild){
  const real=Math.min(stampTotal(),new Set((chatCampuses||[]).filter(c=>CAMPUSES.includes(c))).size);
  return Math.min(stampTotal(),real+(wild&&real===stampTotal()-1?1:0));
}
const TEAMS=['Consulting','P&O','Operations','Finance','Business Development','Marketing','Infrastructure & Automations','Presidency'];
const ROLES=['Consultant','Project Leader','Associate Director','Director','Board'];
const SKILLS=['Excel & modelling','Slides & storylining','Market research','Client communication','Case interviews','Public speaking','Project management','Data & coding','Design','Career advice'];
const FREQ=[['monthly','Once a month'],['every','Every round'],['paused','Pause for now']];
const REASON={mutual:'Picked each other',picked:'Picked',swap:'Skill swap',newlink:'New campus link',mix:'Cross-campus',sameteam:'Other campus, same team',team:'Same campus, other team',home:'Home stamp',manual:'Set by P&O'};
const STARTERS=['Ask why they chose their codename.','Swap the best project you have each worked on at 180DC.','Ask what their campus does better than yours.','Trade one thing you wish you had known in your first month.'];
const GEO={London:[-0.13,51.51],Paris:[2.35,48.86],Madrid:[-3.7,40.42],Turin:[7.69,45.07],Berlin:[13.4,52.52],Warsaw:[21.01,52.23]};
const LABEL={London:[-15,-12,'end'],Paris:[-15,20,'end'],Madrid:[0,30,'middle'],Turin:[0,30,'middle'],Berlin:[0,-18,'middle'],Warsaw:[0,-18,'middle']};

/*MATCH-START*/
function pairKey(a,b){return a<b?a+'|'+b:b+'|'+a}
function campusPair(a,b){return a<b?a+'|'+b:b+'|'+a}
function overlap(a,b){const s=new Set(b||[]);return (a||[]).filter(x=>s.has(x))}
function mulberry(seed){let t=seed>>>0;return function(){t=(t+0x6D2B79F5)>>>0;let r=Math.imul(t^(t>>>15),1|t);r=(r+Math.imul(r^(r>>>7),61|r))^r;return((r^(r>>>14))>>>0)/4294967296}}
// Pairs one round. Never a repeat pair, never two people from the same campus AND the same team.
// Who counts as a good partner, best first:
//   1. another campus, another team   2. another campus, same team   3. same campus, another team
// Exception: once someone has every other campus stamped, a partner from their own campus on another team
// counts as level 1, because that's their last (home) stamp.
// Order: mutual picks, then one-way picks (longest wait first), then everyone else, filling level 1 for
// as many people as possible before falling back to 2, then 3. Within a level: a campus they still need,
// then skill swap and campus pairs that haven't talked yet. Anyone left over joins a pair as a group of three.
// Pairs P&O set by hand ('fixed') go in first, exactly as given, and everyone else is paired around them.
function makePairs(input){
  const {profiles,picks,history,round,edges,seed}=input;
  const rand=mulberry(seed||1);
  const byId=new Map(profiles.map(p=>[p.uid,p]));
  const met=new Set(),last={};
  for(const m of history){const ms=m.members;for(let i=0;i<ms.length;i++){last[ms[i]]=Math.max(last[ms[i]]||0,m.round);for(let j=i+1;j<ms.length;j++)met.add(pairKey(ms[i],ms[j]))}}
  const fixed=[],F=new Set();
  for(const g0 of input.fixed||[]){const g=[...new Set(g0)].filter(u=>byId.has(u)&&!F.has(u));if(g.length>=2){g.forEach(u=>F.add(u));fixed.push(g)}}
  const eligible=[],resting=[];
  for(const p of profiles){if(F.has(p.uid))continue;if(p.freq==='paused'||(p.freq!=='every'&&last[p.uid]===round-1))resting.push(p.uid);else eligible.push(p.uid)}
  const E=new Set(eligible);
  const jit=new Map(eligible.map(u=>[u,rand()]));
  const wait=u=>round-(last[u]||0);
  const order=(a,b)=>wait(b)-wait(a)||jit.get(a)-jit.get(b);
  const fresh=(a,b)=>a!==b&&!met.has(pairKey(a,b));
  // 'Other' (exchange, semester break) is never the same campus as anyone, not even another 'Other'.
  const home=(a,b)=>{const x=byId.get(a).campus;return x===byId.get(b).campus&&x!=='Other'};
  const cross=(a,b)=>fresh(a,b)&&!home(a,b);
  const teamMix=(a,b)=>{if(!fresh(a,b)||!home(a,b))return false;const A=byId.get(a),B=byId.get(b);return !!A.team&&!!B.team&&A.team!==B.team};
  const ok=(a,b)=>cross(a,b)||teamMix(a,b);
  const sameTeam=(a,b)=>{const A=byId.get(a),B=byId.get(b);return !!A.team&&A.team===B.team};
  // Stamps so far: the campuses of everyone each person has already met.
  const ALL=input.campuses||[];const seen=new Map(profiles.map(p=>[p.uid,new Set()]));
  for(const m of history)m.members.forEach((u,i)=>{const s=seen.get(u);if(!s)return;m.members.forEach((v,j)=>{if(i===j)return;const c=(m.campuses&&m.campuses[j])||(byId.get(v)||{}).campus;if(c)s.add(c)})});
  const campusOf=u=>byId.get(u).campus;
  const needs=(u,c)=>ALL.includes(c)&&!seen.get(u).has(c);
  // Home stamp is the last stop: ready once every other campus is stamped.
  const homeReady=u=>{const c=campusOf(u);return ALL.includes(c)&&!seen.get(u).has(c)&&ALL.every(x=>x===c||seen.get(u).has(x))};
  const gain=(a,b)=>(needs(a,campusOf(b))?1:0)+(needs(b,campusOf(a))?1:0)+(campusOf(b)==='Other'&&!seen.get(a).has('Other')?.5:0)+(campusOf(a)==='Other'&&!seen.get(b).has('Other')?.5:0);
  const homeTime=(a,b)=>teamMix(a,b)&&(homeReady(a)||homeReady(b));
  // Fair turns: how many times someone has had a chat with only their own campus. When there are more
  // people on one campus than places with other campuses, those who've had more such chats go first.
  const ownOnly=new Map(profiles.map(p=>[p.uid,0]));
  for(const m of history)m.members.forEach((u,i)=>{if(!ownOnly.has(u))return;const cs=m.members.map((v,j)=>(m.campuses&&m.campuses[j])||(byId.get(v)||{}).campus);
    if(cs[i]&&cs[i]!=='Other'&&cs.every((c,j)=>j===i||c===cs[i]))ownOnly.set(u,ownOnly.get(u)+1)});
  const lvl1=(a,b)=>(cross(a,b)&&!sameTeam(a,b))||homeTime(a,b), lvl2=(a,b)=>cross(a,b)&&sameTeam(a,b);
  const level=(a,b)=>lvl1(a,b)?1:lvl2(a,b)?2:teamMix(a,b)?3:9;
  const pk=u=>(picks[u]||[]).filter(v=>E.has(v)&&v!==u);
  const taken=new Set(),matches=[];
  const add=(members,reason)=>{members.forEach(u=>taken.add(u));matches.push({members,reason})};
  for(const g of fixed)add(g.slice(),'manual');
  const swapCount=(a,b)=>{const A=byId.get(a),B=byId.get(b);return overlap(A.teach,B.learn).length+overlap(B.teach,A.learn).length};
  const linkCount=(a,b)=>(edges||{})[campusPair(byId.get(a).campus,byId.get(b).campus)]||0;
  // A campus someone still needs counts most (20 per person), then skills, team, role and new campus links.
  const score=(a,b)=>{const A=byId.get(a),B=byId.get(b);return gain(a,b)*20+Math.min(swapCount(a,b),4)*3+(A.team!==B.team?2:0)+(A.role!==B.role?1:0)+(!home(a,b)?4/(1+linkCount(a,b)):0)+rand()*0.5};
  // 1. Picked each other. Better levels go first.
  const mutual=[];
  for(const a of eligible)for(const b of pk(a))if(a<b&&pk(b).includes(a)&&ok(a,b))mutual.push([a,b]);
  mutual.sort((x,y)=>(level(x[0],x[1])-level(y[0],y[1]))||(wait(y[0])+wait(y[1]))-(wait(x[0])+wait(x[1]))||jit.get(x[0])-jit.get(y[0]));
  for(const [a,b] of mutual)if(!taken.has(a)&&!taken.has(b))add([a,b],'mutual');
  // 2. One-way picks, longest wait first. Of someone's picks, the best level wins.
  for(const a of [...eligible].sort(order)){if(taken.has(a))continue;
    const free=pk(a).filter(b=>!taken.has(b)&&ok(a,b)).sort((x,y)=>level(a,x)-level(a,y));const b=free[0];
    if(b)add([a,b],'picked')}
  // 3. Everyone else, most constrained first.
  const greedy=(pool,rel,reasonOf)=>{let rest=pool.slice();const stuck=[];
    while(rest.length>1){
      const opts=new Map(rest.map(u=>[u,rest.filter(v=>rel(u,v))]));
      // Anyone down to 0 or 1 option goes first, so nobody gets stranded. Then fair turns, then the
      // fewest options, then whoever has waited longest.
      rest.sort((x,y)=>(opts.get(x).length>1)-(opts.get(y).length>1)||ownOnly.get(y)-ownOnly.get(x)||opts.get(x).length-opts.get(y).length||order(x,y));
      const a=rest[0],cand=opts.get(a);
      if(!cand.length){stuck.push(a);rest=rest.slice(1);continue}
      let best=cand[0],bs=-Infinity;for(const b of cand){const sc=score(a,b);if(sc>bs){bs=sc;best=b}}
      add([a,best],reasonOf(a,best));
      rest=rest.filter(u=>u!==a&&u!==best);
    }
    return stuck.concat(rest)};
  let left=greedy(eligible.filter(u=>!taken.has(u)),lvl1,(a,b)=>homeTime(a,b)?'home':swapCount(a,b)>0?'swap':linkCount(a,b)===0?'newlink':'mix');
  left=greedy(left,lvl2,()=>'sameteam');
  left=greedy(left,teamMix,()=>'team');
  // 4. Leftovers join a pair as a group of three, on another campus if possible.
  const unmatched=[];
  for(const u of left){
    let best=null,bs=-Infinity;
    for(const rel of [lvl1,cross,ok]){
      for(const m of matches){if(m.members.length!==2||m.reason==='manual'||!m.members.every(x=>rel(u,x)))continue;const sc=m.members.reduce((t,x)=>t+score(u,x),0);if(sc>bs){bs=sc;best=m}}
      if(best)break}
    if(best){best.members.push(u);best.trio=true;taken.add(u)}else unmatched.push(u);
  }
  return {matches,unmatched,resting};
}
/*MATCH-END*/

const S={phase:'loading',tab:'deck',db:null,user:null,uid:null,isAdmin:false,canWrite:null,
  profiles:new Map(),me:null,priv:null,inbox:null,round:null,stats:null,allPriv:new Map(),rounds:[],loaded:{},
  skipOrder:[],optPicks:null,form:null,formErr:'',saving:false,fb:null,preview:null,shuffle:0,endsOn:null,
  sending:null,confirmDel:null,revealed:new Set(),pending:false,dragging:false,otherTeams:new Set(),deckSeed:0,
  manual:[],manualPick:null,confirmUndo:false};
const $view=document.getElementById('view'),$tabs=document.getElementById('tabs'),$round=document.getElementById('round');

/* ---------- helpers ---------- */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='value')el.value=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:String(c))}
  return el;
}
function s(tag,attrs,...kids){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  if(attrs)for(const k in attrs){if(attrs[k]!=null)el.setAttribute(k,attrs[k])}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:String(c))}
  return el;
}
function hash(str){let x=2166136261;for(let i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
function ck(c){return c?'c-'+c.toLowerCase():''}
function pill(c){return h('span',{class:'pill '+ck(c)},c||'No campus')}
function todayISO(add){const d=new Date();d.setDate(d.getDate()+(add||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return '';const p=String(iso).slice(0,10).split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function plural(n,w,ws){return n+' '+(n===1?w:(ws||w+'s'))}
function canon(o){if(Array.isArray(o))return '['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let toastT;
function toast(msg,kind){const t=document.getElementById('toast');t.textContent=msg;t.className=kind||'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},4200)}
function errMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return 'That didn’t save: you don’t have permission to change this.';
  if(c==='quota_exceeded')return 'The app has run out of storage. Tell P&O.';
  if(c==='resource_exhausted')return 'Too many saves at once. Wait a few seconds and try again.';
  if(c==='revoked')return 'You’ve been signed out. Reload the page and sign in again.';
  return 'Saving failed. Check your connection and try again.'}

const queues=new Map();
function enqueue(path,fn){const prev=queues.get(path)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);queues.set(path,next);return next}
async function save(path,data){
  const run=()=>enqueue(path,()=>S.db.doc(path).set(data));
  try{await run();return true}catch(e){
    if(e&&e.code==='unavailable'){await sleep(400+Math.random()*700);try{await run();return true}catch(e2){toast(errMsg(e2),'bad');return false}}
    toast(errMsg(e),'bad');return false}
}
async function remove(path){try{await enqueue(path,()=>S.db.doc(path).delete());return true}catch(e){toast(errMsg(e),'bad');return false}}

function loadRevealed(){try{return new Set(JSON.parse(localStorage.getItem('cc-revealed')||'[]'))}catch(e){return new Set()}}
function storeRevealed(){try{localStorage.setItem('cc-revealed',JSON.stringify([...S.revealed]))}catch(e){}}

/* ---------- rendering ---------- */
let rq=false;
function isTyping(){const a=document.activeElement;if(!a||!$view.contains(a))return false;return a.tagName==='TEXTAREA'||a.tagName==='SELECT'||(a.tagName==='INPUT'&&/^(text|email|date)$/.test(a.type))}
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;if(isTyping()||S.dragging){S.pending=true;return}render()})}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending&&!isTyping()&&!S.dragging){S.pending=false;render()}},0));

const joined=()=>!!(S.me&&S.priv);
function tabsFor(){
  if(S.phase!=='ready')return [];
  const t=joined()?[['deck','Deck'],['match','My match'],['passport','Passport'],['map','Map'],['profile','Profile'],['rules','Rules']]:[['deck','Join'],['map','Map'],['rules','Rules']];
  if(S.isAdmin)t.push(['admin','P&O']);
  return t;
}
function renderHeader(){
  $round.textContent=S.round?('Round '+S.round.number+' · until '+fmtDate(S.round.endsOn)):(S.phase==='ready'?'First round soon':'');
  $round.hidden=!$round.textContent;
  $tabs.replaceChildren(...tabsFor().map(([k,l])=>{
    const b=h('button',{class:'tab',type:'button','aria-current':S.tab===k?'page':null,onclick:()=>go(k)},l);
    if(k==='match'&&hasUnrevealed())b.append(h('span',{class:'dot',title:'New match'}));
    return b}));
}
function render(){
  S.pending=false;
  renderHeader();
  let v;
  if(S.phase==='loading')v=h('div',{class:'skeleton'},'Loading the deck…');
  else if(S.phase==='login')v=S.tab==='rules'?rulesView():loginView();
  else if(S.phase==='config')v=notice('Almost there','Add your Supabase project URL and key to config.js, then reload this page.');
  else if(S.phase==='nodb')v=notice('Couldn’t load the deck','Check your connection and reload the page.');
  else if(S.tab==='admin'&&S.isAdmin)v=adminView();
  else if(S.tab==='map')v=mapView();
  else if(S.tab==='rules')v=rulesView();
  else if(!joined())v=joinView();
  else v=({deck:deckView,match:matchView,passport:passportView,profile:profileView}[S.tab]||deckView)();
  $view.replaceChildren(v);
}
function notice(title,body){return h('div',{class:'panel stack',style:'max-width:560px'},h('h2',null,title),h('p',{class:'muted'},body))}
const TABS=['deck','match','passport','map','profile','rules','admin'];
function fromHash(){const k=(location.hash||'').slice(1);return TABS.includes(k)?k:'deck'}
function go(k){S.form=null;S.formErr='';S.fb=null;S.confirmDel=null;if(location.hash!=='#'+k)location.hash=k;else{S.tab=k;render()}}
window.addEventListener('hashchange',()=>{S.tab=fromHash();S.form=null;render();window.scrollTo(0,0)});
S.tab=fromHash();

/* ---------- derived member state ---------- */
function myMatches(){return ((S.inbox&&S.inbox.matches)||[]).slice().sort((a,b)=>b.round-a.round)}
function currentMatch(){return S.round?myMatches().find(m=>m.round===S.round.number)||null:null}
function hasUnrevealed(){const m=joined()&&currentMatch();return !!(m&&!S.revealed.has(m.id))}
function myMet(){const s=new Set();for(const m of myMatches())for(const p of m.partners||[])s.add(p.uid);return s}
function validPicks(){
  const raw=S.optPicks||(S.priv&&S.priv.picks)||[];const met=myMet();
  return raw.filter(u=>{const p=S.profiles.get(u);return p&&u!==S.uid&&canMeet(u,p)&&p.freq!=='paused'&&!met.has(u)}).slice(0,3);
}
// Someone from another campus, or (once those run out) someone on your campus from another team.
// Teams are private, so the database tells us which people on your campus are on other teams.
function canMeet(u,p){return !sameCampus(p.campus,S.me.campus)||S.otherTeams.has(u)}
let otT=null;
function refreshOtherTeams(){clearTimeout(otT);otT=setTimeout(async()=>{
  try{const r=await SB.rpc('same_campus_other_teams');if(r.error)throw r.error;
    const next=new Set((r.data||[]).map(x=>typeof x==='string'?x:(x.same_campus_other_teams||x.id)));
    if(canon([...next].sort())!==canon([...S.otherTeams].sort())){S.otherTeams=next;scheduleRender()}}
  catch(e){console.warn('Business Tinder: other teams',e)}},300)}
function myWild(){
  const fb=(S.priv&&S.priv.feedback)||{};
  for(const m of myMatches().slice().reverse())if(fb[m.id]&&fb[m.id].status==='done'&&(m.partners||[]).some(p=>p.campus===OTHER))return m.round;
  const w=((S.stats&&S.stats.wild)||{})[S.uid];return w||0;
}
function myStamps(){
  const map=new Map();const fb=(S.priv&&S.priv.feedback)||{};
  const ms=myMatches().slice().reverse();
  for(const m of ms)if(fb[m.id]&&fb[m.id].status==='done')for(const p of m.partners||[])if(p.campus&&p.campus!==OTHER&&!map.has(p.campus))map.set(p.campus,m.round);
  const fromStats=((S.stats&&S.stats.passports)||{})[S.uid]||[];
  for(const c of fromStats)if(!map.has(c)){const m=ms.find(x=>(x.partners||[]).some(p=>p.campus===c));map.set(c,m?m.round:null)}
  return map;
}

/* ---------- the ticket card ---------- */
function ticketEl(p,opts){
  const preview=!!(opts&&opts.preview);const me=S.me||{};
  const home=!preview&&sameCampus(p.campus,me.campus);
  const myLearn=new Set(me.learn||[]),myTeach=new Set(me.teach||[]);
  const chips=(list,mine)=>list&&list.length?list.map(t=>h('span',{class:'chip'+(!preview&&mine.has(t)?' hit':'')},t)):h('span',{class:'muted'},preview?'Pick up to 3 below':'Nothing listed');
  const swap=preview?0:overlap(p.teach,me.learn).length+overlap(me.teach,p.learn).length;
  return h('article',{class:'ticket '+ck(p.campus)},
    h('div',{class:'tk-band'}),
    h('div',{class:'tk-body'},
      h('div',{class:'tk-head'},p.campus?pill(p.campus):h('span',{class:'pill'},'Campus'),h('span',{class:'lbl'},preview?'Team and role stay hidden':home?'Your campus · another team':'')),
      h('h2',{class:'codename'},p.codename||'Your codename'),
      p.fun?h('p',{class:'fun'},p.fun):null,
      h('div',{class:'tk-row'},h('span',{class:'lbl'},'Can teach'),h('div',{class:'chips'},chips(p.teach,myLearn))),

/* ---------- Supabase data layer ----------
   Same calls the app makes everywhere else (doc().get/set/delete/onSnapshot, collection().onSnapshot),
   backed by one table per collection. The database rules in supabase-setup.sql decide who sees what. */
const TABLES={profiles:'profiles',private:'private',inbox:'inbox',rounds:'rounds',public:'public_docs'};
function dbError(e){
  if(!e)return {code:'unavailable',message:'Unknown error'};
  const m=String(e.message||'');
  if(e.code==='42501'||/row-level security|permission denied/i.test(m))return {code:'invalid_argument',message:m};
  if(e.code==='PGRST301'||/JWT/i.test(m))return {code:'revoked',message:m};
  if(e.code==='23505'||/duplicate key/i.test(m))return {code:'already_exists',message:m};
  return {code:'unavailable',message:m};
}
function makeDb(sb){
  const subs=new Set();let channel=null;
  const snap=(id,row)=>({id,exists:!!row,data:()=>row?row.data:undefined});
  const refresh=t=>{for(const s of subs)if(!t||s.table===t)s.run()};
  function listen(){
    if(channel)return;
    channel=sb.channel('coffee-chats').on('postgres_changes',{event:'*',schema:'public'},p=>refresh(p.table)).subscribe();
  }
  setInterval(()=>{if(document.visibilityState==='visible')refresh()},45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
  function watch(table,fetch,next){
    listen();let seq=0;
    const s={table,run:async()=>{const my=++seq;try{const v=await fetch();if(my===seq)next(v)}catch(e){console.warn('Coffee Chats: '+table,e)}}};
    subs.add(s);s.run();return ()=>subs.delete(s);
  }
  function doc(path){
    const [name,id]=path.split('/');const table=TABLES[name];
    if(!table||!id)throw new TypeError('Unknown document '+path);
    const fetchOne=async()=>{const r=await sb.from(table).select('id,data').eq('id',id).maybeSingle();if(r.error)throw dbError(r.error);return snap(id,r.data)};
    return {
      get:fetchOne,
      async set(body){const r=await sb.from(table).upsert({id,data:body});if(r.error)throw dbError(r.error);refresh(table)},
      // Insert only: fails with 'already_exists' instead of overwriting, so two P&O members can't send the same round.
      async create(body){const r=await sb.from(table).insert({id,data:body});if(r.error)throw dbError(r.error);refresh(table)},
      async delete(){const r=await sb.from(table).delete().eq('id',id);if(r.error)throw dbError(r.error);refresh(table)},
      onSnapshot(next){return watch(table,fetchOne,next)}
    };
  }
  function collection(name){
    const table=TABLES[name];if(!table)throw new TypeError('Unknown collection '+name);
    let lim=1000;
    const fetchAll=async()=>{const r=await sb.from(table).select('id,data').limit(lim);if(r.error)throw dbError(r.error);const docs=(r.data||[]).map(row=>snap(row.id,row));return {docs,size:docs.length,empty:!docs.length}};
    const q={limit(n){lim=n;return q},get:fetchAll,onSnapshot(next){return watch(table,fetchAll,next)}};
    return q;
  }
  return {doc,collection};
}

  const ae=document.getElementById('acct-email');ae.textContent=email;ae.hidden=false;
  document.getElementById('signout').hidden=false;
  S.phase='loading';S.revealed=loadRevealed();render();
  subscribe();
}
async function boot(){
  render();
  const cfg=window.CC_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseKey||/YOUR-/.test(cfg.supabaseUrl+cfg.supabaseKey)){S.phase='config';render();return}
  const urlErr=authErrorFromUrl();
  if(urlErr)S.login={email:'',sent:false,busy:false,err:urlErr,errFrom:'google'};
  SB=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  document.getElementById('signout').addEventListener('click',async()=>{await SB.auth.signOut();location.replace(location.pathname)});
  SB.auth.onAuthStateChange((event,session)=>{if(session&&!S.uid)setTimeout(()=>start(session),0)});
  const r=await SB.auth.getSession();
  if(r.data&&r.data.session)await start(r.data.session);
  else if(!S.uid){S.phase='login';render()}
}
boot();
</script>
