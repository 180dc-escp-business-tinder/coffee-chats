# Keeps Business Tinder's free Supabase database from pausing.
# Supabase pauses free projects after about a week with no activity, so this pings
# the database once a day. It also tells GitHub to keep this schedule switched on,
# because GitHub turns off schedules in repos that get no commits for 60 days.
# To run it by hand: Actions tab > Keep database awake > Run workflow.
name: Keep database awake
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS --retry 3 --retry-delay 20 -X POST \
            "https://rkubddlbjpbvqyeoczhj.supabase.co/rest/v1/rpc/keep_alive" \
            -H "apikey: sb_publishable_vbBAEsYzeXzDVYABFEtQJg_uJ0JAAdP" \
            -H "Content-Type: application/json" -d '{}'
      - name: Keep this daily schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
